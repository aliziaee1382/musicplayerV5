workflows:
  android-apk-build:
    name: Build 0003 Player APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    scripts:
      - name: Setup Environment & Build APK
        script: |
          # 1. ساخت فایل‌های .env جهت جلوگیری از خطای Plugin
          touch .env.example
          touch .env

          # 2. تولید کلید امضای Debug
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          # 3. دانلود و تنظیم Gradle
          curl -sL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip
          export PATH=$(pwd)/gradle-9.3.1/bin:$PATH

          # 4. اجرای دستور ساخت APK
          gradle assembleDebug
    artifacts:
      - "**/build/outputs/**/*.apk"
