workflows:
  android-apk-build:
    name: Build 0003 Player APK
    max_build_duration: 30
    instance_type: ubuntu_x2
    scripts:
      - name: Setup Environment & Build APK
        script: |
          # 1. ساخت فایل‌های .env جهت جلوگیری از خطای Plugin
          touch .env.example
          touch .env

          # 2. اعطای دسترسی اجرایی به فایل gradlew
          chmod +x gradlew

          # 3. اجرای دستور ساخت APK نسخه Debug
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
